<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoddies Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  
  <style>
    /* --- LUXURY SEXY MIX DESIGN SYSTEM --- */
    :root {
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --panel-glass: rgba(255, 255, 255, 0.04);
      --panel-glass-hover: rgba(255, 255, 255, 0.12);
      --border-lux: rgba(255, 255, 255, 0.08);
      --border-lux-hover: rgba(192, 132, 252, 0.4);
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Playfair Display', serif;
      --cb-luxury: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* THE IRIDESCENT NEO-NOIR BACKGROUND (Sexy Dynamic Gradient Mix) */
    body {
      background: linear-gradient(145deg, #1a0b2e 0%, #0c231a 30%, #3b0d26 65%, #120e3d 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      letter-spacing: -0.01em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* Cinematic Light Emitters to make the background pop */
    body::before {
      content: "";
      position: fixed;
      top: -20%;
      right: -10%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, transparent 60%);
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -15%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 65%);
      z-index: -2;
      pointer-events: none;
    }

    /* Film Grain Layer for High-End Editorial Feel */
    .bg-grid-texture {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.22;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='noise'%3e%3cturbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noise)'/%3e%3c/svg%3e");
    }

    /* Interactive Fluid Lens Mouse Tracker */
    .ambient-fluid-lens {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      transform: translate(-50%, -50%);
      will-change: transform;
      mix-blend-mode: plus-lighter;
      transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* --- EDITORIAL HEADER --- */
    .hero {
      position: relative;
      height: 40vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 1px solid var(--border-lux);
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .hero-tag {
      font-size: 0.65rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      font-weight: 600;
    }

    .hero-title {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 300;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
    }

    .serif-italic {
      font-family: var(--font-serif);
      font-style: italic;
      color: #f472b6;
      text-transform: lowercase;
    }

    /* --- WORKSPACE LAYOUT --- */
    .archive-workspace {
      max-width: 1600px;
      margin: 0 auto;
      padding: 4rem 3rem 10rem 3rem;
    }

    /* CONTROL PANEL */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-lux);
      padding-bottom: 1.5rem;
      margin-bottom: 4rem;
    }

    .nav-indicator {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-indicator .active-view {
      color: var(--text-main);
      font-weight: 600;
    }

    .filter-trigger-pill {
      background: var(--panel-glass);
      border: 1px solid var(--border-lux);
      color: var(--text-main);
      padding: 0.85rem 2rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.4s var(--cb-luxury);
    }

    .filter-trigger-pill:hover {
      background-color: var(--text-main);
      color: #1a0b2e;
      border-color: var(--text-main);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* SECTION TITLE */
    .drop-descriptor {
      margin: 2rem 0 3rem 0;
    }

    .drop-descriptor h2 {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .drop-descriptor h2::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: var(--border-lux);
    }

    /* HIGH END 4-COLUMN PRODUCTS GRID */
    .luxury-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4.5rem 2rem;
    }

    .product-lux-card {
      position: relative;
      background: var(--panel-glass);
      border: 1px solid var(--border-lux);
      padding: 1.2rem;
      border-radius: 20px;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      opacity: 0;
      transform: translateY(40px);
      animation: viewReveal 0.8s var(--cb-luxury) forwards;
      text-decoration: none;
      transition: background 0.5s var(--cb-luxury), border-color 0.5s var(--cb-luxury), transform 0.5s var(--cb-luxury), box-shadow 0.5s var(--cb-luxury);
    }

    @keyframes viewReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .product-lux-card:hover {
      background: var(--panel-glass-hover);
      border-color: var(--border-lux-hover);
      transform: translateY(-10px);
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6);
    }

    .canvas-container {
      position: relative;
      aspect-ratio: 3 / 4;
      background-color: rgba(255, 255, 255, 0.01);
      overflow: hidden;
      margin-bottom: 1.5rem;
      border-radius: 12px;
    }

    /* Completely Clean Images without text overlays */
    .card-asset {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 1.1s var(--cb-luxury);
    }

    .product-lux-card:hover .card-asset {
      transform: scale(1.05);
    }

    /* CARD DETAILS TYPOGRAPHY */
    .meta-details {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 0.2rem;
    }

    .n-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.3rem;
    }

    .n-color {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .n-price {
      font-size: 1rem;
      font-weight: 600;
      color: #f472b6; /* Radiant Pink accent for pricing */
    }

    /* --- FILTERS SIDE PANEL --- */
    .sidebar-mask {
      position: fixed;
      inset: 0;
      background-color: rgba(10, 5, 20, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .sidebar-mask.active {
      opacity: 1;
      pointer-events: auto;
    }

    .curator-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 440px;
      height: 100%;
      background: rgba(20, 10, 30, 0.85);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border-left: 1px solid var(--border-lux);
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.6s var(--cb-luxury);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .curator-drawer.active {
      transform: translateX(0);
    }

    .drawer-top-bar {
      padding: 2.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-lux);
    }

    .drawer-header-title {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      font-weight: 600;
    }

    .drawer-exit-trigger {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .drawer-scroll-body {
      padding: 3rem 2rem;
      flex-grow: 1;
    }

    .filter-label-header {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .architectural-options-stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .framework-pill-option {
      background: none;
      border: none;
      color: var(--text-muted);
      text-align: left;
      font-size: 0.9rem;
      padding: 0.4rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .framework-pill-option:hover, .framework-pill-option.selected {
      color: var(--text-main);
    }

    .framework-pill-option.selected {
      font-weight: 600;
      padding-left: 0.8rem;
      border-left: 2px solid #f472b6;
    }

    .drawer-bottom-bar {
      padding: 2rem;
      border-top: 1px solid var(--border-lux);
    }

    .commit-view-btn {
      width: 100%;
      background-color: var(--text-main);
      color: #1a0b2e;
      border: none;
      padding: 1.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      cursor: pointer;
      border-radius: 12px;
    }

    /* --- ENGINE RESPONSIVENESS --- */
    @media (max-width: 1300px) {
      .luxury-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 900px) {
      .luxury-grid { grid-template-columns: repeat(2, 1fr); gap: 3.5rem 1.5rem; }
      .archive-workspace { padding: 3rem 1.5rem; }
    }

    @media (max-width: 580px) {
      .luxury-grid { grid-template-columns: 1fr; gap: 4rem 0; }
      .control-panel { flex-direction: column; gap: 1.5rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- DATA & LOGIC CONTROL SCRIPT -->

      { id: 7, name: "Core Structural Crop Hoodie", price: "$140", color: "Slate Cobalt Blue", fit: "Boxy", imgBase: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSv3gVgFJurIaO4mVUkFd7uAao4ta5HUjagVpULkIVJLQ&s=10", imgAlt: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0FEaBM-as6nZNSPSjD1x59SAbsRGhHA-dkt6to5InBA&s=10" },

      { id: 9, name: "Exaggerated Heavy Silhouette", price: "$210", color: "Deep Mulberry Wine", fit: "Oversized", imgBase: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwX3Qy2gZr6imMaFR5JgonWFJzhpcVN-YfzlzKzZsxHQ&s=10", imgAlt: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2lSTpcjIG91GYOCxrTFyITCTPLlEl3LT3gcpCl0JfNQ&s=10" },
      { id: 10, name: "Premium Tailored Interlock", price: "$185", color: "Mineral Ash Green", fit: "Luxury", imgBase: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2ItkZzbXLBKUrXUNODmXzMt6_kin8vslX7mw2hZY3KQ&s=10", imgAlt: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGC2vN0uOSAcPHEX8KZFWD0fLSDlqIGDbgLTIer3GJOg&s" },
      { id: 11, name: "Box-Cut Architectural Hood", price: "$170", color: "Smoked Ember Violet", fit: "Boxy", imgBase: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2n6PIhqkVGxId7UvPVBd3SYXvv_gWWWIKwgj2QepY-Q&s=10", imgAlt: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjhkCBe6kleLWTTnyjkKbJHuNyfn8XwXJhr3oj9HmZww&s" },

    ];

    let currentArchitectureType = "All";

    const foundationGrid = document.getElementById('foundationDeck');
    const archiveCounter = document.getElementById('totalItems');
    const openDrawerBtn = document.getElementById('openDrawerTrigger');
    const closeDrawerBtn = document.getElementById('closeDrawerTrigger');
    const drawerWrapper = document.getElementById('curatorDrawer');
    const maskOverlay = document.getElementById('drawerMask');
    const frameworkSelectors = document.querySelectorAll('.framework-pill-option');
    const fluidLens = document.getElementById('fluidLens');

    // Smooth Interactive Mouse Following Radial Spotlight
    window.addEventListener('mousemove', (e) => {
      fluidLens.style.left = `${e.clientX}px`;
      fluidLens.style.top = `${e.clientY}px`;
    });

    function paintSectionArchive(targetDOMNode, targetSourceStream) {
      targetDOMNode.innerHTML = '';
      
      const filteredElements = currentArchitectureType === "All" 
        ? targetSourceStream 
        : targetSourceStream.filter(element => element.fit === currentArchitectureType);

      if (filteredElements.length === 0) {
        targetDOMNode.style.display = 'none';
        targetDOMNode.previousElementSibling.style.display = 'none';
      } else {
        targetDOMNode.style.display = 'grid';
        targetDOMNode.previousElementSibling.style.display = 'block';
      }

      filteredElements.forEach((item, index) => {
        const componentNode = document.createElement('div');
        componentNode.className = 'product-lux-card';
        componentNode.style.animationDelay = `${index * 0.04}s`;
        
        componentNode.innerHTML = `
          <div class="canvas-container">
            <img class="card-asset" src="${item.imgBase}" alt="${item.name}" data-swap="${item.imgAlt}" data-origin="${item.imgBase}">
          </div>
          <div class="meta-details">
            <div>
              <h3 class="n-title">${item.name}</h3>
              <p class="n-color">${item.color}</p>
            </div>
            <span class="n-price">${item.price}</span>
          </div>
        `;

        const targetImg = componentNode.querySelector('.card-asset');
        componentNode.addEventListener('mouseenter', () => targetImg.src = targetImg.getAttribute('data-swap'));
        componentNode.addEventListener('mouseleave', () => targetImg.src = targetImg.getAttribute('data-origin'));

        targetDOMNode.appendChild(componentNode);
      });

      return filteredElements.length;
    }

    function syncAndComputeLayout() {
      const activeFoundationCount = paintSectionArchive(foundationGrid, COMPONENT_DROP_01);
      archiveCounter.textContent = activeFoundationCount;
    }

    openDrawerBtn.addEventListener('click', () => { drawerWrapper.classList.add('active'); maskOverlay.classList.add('active'); });
    closeDrawerBtn.addEventListener('click', () => { drawerWrapper.classList.remove('active'); maskOverlay.classList.remove('active'); });
    maskOverlay.addEventListener('click', () => { drawerWrapper.classList.remove('active'); maskOverlay.classList.remove('active'); });
    document.getElementById('commitViewTrigger').addEventListener('click', () => { drawerWrapper.classList.remove('active'); maskOverlay.classList.remove('active'); });

    frameworkSelectors.forEach(button => {
      button.addEventListener('click', (event) => {
        frameworkSelectors.forEach(node => node.classList.remove('selected'));
        event.target.classList.add('selected');
        currentArchitectureType = event.target.getAttribute('data-architecture');
        syncAndComputeLayout();
      });
    });

    document.addEventListener('DOMContentLoaded', syncAndComputeLayout);
  </script>
</body>
</html>
